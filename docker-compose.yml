services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monaco
      POSTGRES_USER: monaco
      POSTGRES_PASSWORD: monaco
    volumes:
      - monaco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monaco -d monaco"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    command: sh -c "npx prisma migrate deploy && npm start"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    command: npm run bot
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  monaco_pgdata:
