name: Bootstrap Monaco MVP

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          cat .bootstrap/part* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C /tmp
          cp -a /tmp/monaco-mvp/. .

      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit"
            exit 0
          fi
          git commit -m "feat: implement Monaco Aquapark MVP"
          git push
